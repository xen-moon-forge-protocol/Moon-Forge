name: Announcements (weekly)

# Original posts on the project's own channels (X, optional Telegram channel): a weekly state of the
# forge read from chain. Never replies, mentions or DMs; no price predictions. Without the channel keys
# (repository secrets) the text is only printed in the log. Enable with the repository variable
# ANNOUNCE_ENABLED=true. The epoch receipt is posted by the oracle workflow right after publication.

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      kind:
        description: 'weekly or epoch'
        default: 'weekly'
      dry:
        description: 'Dry run (print only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    if: ${{ vars.ANNOUNCE_ENABLED == 'true' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oracle/package-lock.json
      - working-directory: oracle
        run: npm ci
      - name: Post
        working-directory: oracle
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_ETH: ${{ vars.PORTAL_ETH }}
          PORTAL_OP: ${{ vars.PORTAL_OP }}
          PORTAL_BSC: ${{ vars.PORTAL_BSC }}
          PORTAL_POLYGON: ${{ vars.PORTAL_POLYGON }}
          PORTAL_AVAX: ${{ vars.PORTAL_AVAX }}
          PORTAL_BASE: ${{ vars.PORTAL_BASE }}
          PORTAL_PULSE: ${{ vars.PORTAL_PULSE }}
        run: |
          KIND="${{ github.event.inputs.kind || 'weekly' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry }}" = "true" ]; then
            npm run announce -- "$KIND" --dry
          else
            npm run announce -- "$KIND"
          fi
