name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: |
          npm run build
          # the build prerenders every route (dist/<route>/index.html, with its own text, canonical and FAQ) and
          # dist/404.html; never overwrite those, only fill a route the prerender did not write, so deep links
          # (shared links, crawlers, agents) still answer HTTP 200
          [ -f dist/404.html ] || cp dist/index.html dist/404.html
          for r in start faq forge missions artifacts nft marketplace games donate whitepaper transparency; do
            [ -f "dist/$r/index.html" ] || { mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"; }
          done
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
