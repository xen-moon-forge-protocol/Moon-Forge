name: Deploy Frontend to GitHub Pages

# Actions pinned to commit SHAs (version in the comment), runner image pinned, Node 22, `npm ci --ignore-scripts`.
# keeper.yml's feed job builds the site with the same "Build" commands (checked by oracle/test/feed.test.ts).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: |
          npm run build
          # the build prerenders every route (dist/<route>/index.html, with its own text, canonical and FAQ) and
          # dist/404.html; never overwrite those, only fill a route the prerender did not write, so deep links
          # (shared links, crawlers, agents) still answer HTTP 200
          [ -f dist/404.html ] || cp dist/index.html dist/404.html
          for r in start faq forge missions artifacts nft marketplace games donate whitepaper transparency; do
            [ -f "dist/$r/index.html" ] || { mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"; }
          done
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
