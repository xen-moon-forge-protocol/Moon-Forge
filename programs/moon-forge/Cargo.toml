[package]
name = "moon-forge"
version = "2.0.0"
description = "Moon Forge Protocol: burn XEN on a supported EVM chain, receive XNT on X1. Zero protocol fee on the burn path."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "moon_forge"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
# Integration-test build only: test keys + compressed time. Never deployed.
localnet = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
sha3 = { version = "0.10", default-features = false }
solana-define-syscall = "=2.3.0"
